spring.application.name=ticket-wave
spring.profiles.active=local
server.port=8081
springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/api-docs
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.info.env.enabled=true
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration=3600000
security.jwt.refresh-expiration=604800000

storage.bucket=${STORAGE_BUCKET:ticketwave-images}

storage.endpoint=http://localhost:${LOCALSTACK_PORT:4566}

storage.region=${STORAGE_REGION:us-east-1}

storage.access-key=${AWS_ACCESS_KEY_ID}
storage.secret-key=${AWS_SECRET_ACCESS_KEY}

spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
management.health.mail.enabled=false
app.password-reset.frontend-url=${FRONTEND_URL:http://localhost:4200}
app.password-reset.from=${SMTP_FROM:no-reply@ticketwave.test}
