name: CI

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  build-and-tests:
    name: Build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: app/pom.xml

      - name: Compilar e testar com Maven
        run: ./mvnw -B -ntp -f app/pom.xml verify
